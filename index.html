          <span><span class="swatch" style="background:var(--warn-light); border-color:var(--warn);"></span>Visited, not answered</span>
          <span><span class="swatch" style="background:#fff;"></span>Not visited</span>
          <span><span class="swatch" style="background:var(--purple); border-color:var(--purple);"></span>Marked for review</span>
        </div>
      </div>
    </div>
    <div class="exam-toolbar">
      <div class="left-group">
        <button class="btn outline small" data-action="exam-clear">Clear Response</button>
        <button class="btn outline small" data-action="exam-mark-next">Mark for Review &amp; Next</button>
      </div>
      <div class="right-group">
        <button class="btn gold small" data-action="exam-save-next">Save &amp; Next</button>
        <button class="btn danger small" data-action="exam-submit-open">Submit Exam</button>
      </div>
    </div>
    ${modalHtml}
  `;
}

/* ================= RENDER: EXAM SUMMARY ================= */
function renderExamSummary(){
  const ex = state.exam;
  const total = ex.questions.length;
  let score = 0;
  ex.questions.forEach((q,i)=>{ if(isCorrectAnswer(q, ex.answers[i])) score++; });
  const pct = Math.round(score/total*100);
  const pass = pct >= passPct();

  const topicStats = {};
  ex.questions.forEach((q,i)=>{
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total++;
    if(isCorrectAnswer(q, ex.answers[i])) topicStats[q.topic].correct++;
  });

  const topicBars = Object.keys(topicStats).map(t=>{
    const s = topicStats[t];
    const p = Math.round(s.correct/s.total*100);
    return `<div class="topic-bar-row">
      <div class="label">${esc(topicLabel(t))}</div>
      <div class="topic-bar-track"><div class="topic-bar-fill" style="width:${p}%"></div></div>
      <div class="pct">${p}%</div>
    </div>`;
  }).join('');

  const reviewHtml = ex.questions.map((q,i)=>{
    const ans = ex.answers[i];
    const correct = isCorrectAnswer(q, ans);
    const skipped = !isAnswered(ans);
    return `
      <div class="review-item">
        <div class="qh"><b>${i+1}. ${esc(q.text)}</b>
          <span class="tag ${skipped?'skip':(correct?'correct':'wrong')}">${skipped?'Not Answered':(correct?'Correct':'Incorrect')}</span>
        </div>
        <div class="ans-line">Your answer: <b>${esc(answerText(q, ans))}</b></div>
        ${!correct ? `<div class="ans-line">Correct answer: <b>${esc(correctText(q))}</b></div>` : ''}
        <div class="ans-line" style="color:var(--ink-soft);">${esc(q.explanation)}</div>
      </div>
    `;
  }).join('');

  const durationTaken = ex.finishedSeconds != null ? fmtTime(ex.finishedSeconds) : '—';

  return `
    <div class="panel ornate">
      <h3>Exam Report</h3>
      <div class="score-hero">
        <div class="ring" style="background:conic-gradient(${pass?'var(--success)':'var(--danger)'} ${pct}%, var(--parchment-dark) 0);">
          <b>${pct}%</b><span>${score}/${total}</span>
        </div>
        <div>
          <span class="${pass?'badge-pass':'badge-fail'}">${pass?'PASS':'FAIL'}</span>
          <p style="color:var(--ink-soft); margin-top:10px;">Time taken: ${durationTaken} &middot; Integrity flags: ${ex.tabSwitches}</p>
          <div style="display:flex; gap:10px; margin-top:10px;">
            <button class="btn gold" data-action="exam-retake">Retake Exam</button>
            <button class="btn outline" data-action="nav" data-view="home">Back to Study Hall</button>
          </div>
        </div>
      </div>
      <h3>Performance by Topic</h3>
      ${topicBars}
      <div style="margin-top:16px;">
        <button class="btn outline small" data-action="exam-toggle-review">${ex.showReview?'Hide':'Show'} Detailed Review</button>
      </div>
      ${ex.showReview ? `<div style="margin-top:14px;">${reviewHtml}</div>` : ''}
    </div>
  `;
}

/* ================= ACTIONS ================= */
function stopExamTimer(){
  if(state.exam.timerId){ clearInterval(state.exam.timerId); state.exam.timerId = null; }
}
function startExamTimer(){
  stopExamTimer();
  state.exam.timerId = setInterval(()=>{
    state.exam.timeLeft--;
    if(state.exam.timeLeft <= 0){
      state.exam.timeLeft = 0;
      submitExam(true);
      return;
    }
    const timerEl = document.querySelector('.timer');
    if(timerEl){
      timerEl.innerHTML = ICONS.clock + ' ' + fmtTime(state.exam.timeLeft);
      timerEl.classList.toggle('low', state.exam.timeLeft <= 120);
    }
  }, 1000);
}

function submitExam(auto){
  stopExamTimer();
  const ex = state.exam;
  let score = 0;
  ex.questions.forEach((q,i)=>{ if(isCorrectAnswer(q, ex.answers[i])) score++; });
  const total = ex.questions.length;
  const percent = Math.round(score/total*100);
  const elapsed = examDurationSec() - ex.timeLeft;
  ex.finishedSeconds = elapsed;
  ex.submitted = true;
  ex.showModal = false;

  const history = loadHistory();
  history.push({
    date: new Date().toLocaleString(),
    score, total, percent,
    duration: fmtTime(elapsed)
  });
  saveHistory(history);

  state.view = 'exam-summary';
  render();
  if(auto) showToast('Time expired — exam auto-submitted.');
}

function handleAction(action, el){
  switch(action){
    case 'nav': {
      if(state.view === 'exam-run' && !state.exam.submitted){
        if(!confirm('Leave the exam now? Your progress will be lost and this will count as an incomplete attempt.')) return;
        stopExamTimer();
        resetExam();
      }
      state.view = el.dataset.view;
      render();
      break;
    }
    case 'select-subject': {
      const subj = el.dataset.subject;
      if(!subj || !SUBJECT_META[subj]) break;
      if(state.view === 'exam-run' && !state.exam.submitted){ stopExamTimer(); }
      state.subject = subj;
      state.study.topic = DOCS[subj][0].id;   // topic keys differ per subject — reset to first doc
      state.practice.topic = 'all';
      resetExam();
      state.view = 'study';
      render();
      break;
    }
    case 'reset-history': {
      if(confirm('Clear all saved exam history from this browser?')){
        localStorage.removeItem(historyKey());
        render();
      }
      break;
    }
    case 'study-topic': {
      state.study.topic = el.dataset.topic;
      render();
      break;
    }
    case 'study-practice-jump': {
      state.practice.topic = el.dataset.topic;
      state.view = 'practice-setup';
      render();
      break;
    }
    case 'practice-start': {
      const topicSel = document.getElementById('practiceTopicSelect');
      const countSel = document.getElementById('practiceCountSelect');
      state.practice.topic = topicSel.value;
      state.practice.count = parseInt(countSel.value, 10);
      state.practice.questions = prepareQuestions(QUESTIONS[state.subject], state.practice.topic, state.practice.count);
      state.practice.index = 0;
      state.practice.answers = [];
      state.practice.checked = false;
      state.practice.score = 0;
      state.view = 'practice-run';
      render();
      break;
    }
    case 'practice-select': {
      const p = state.practice;
      if(p.checked) return;
      const q = p.questions[p.index];
      p.answers[p.index] = toggleSel(p.answers[p.index], parseInt(el.dataset.index, 10), q.multi);
      render();
      break;
    }
    case 'practice-check': {
      const p = state.practice;
      if(!isAnswered(p.answers[p.index])) return;
      p.checked = true;
      const q = p.questions[p.index];
      if(isCorrectAnswer(q, p.answers[p.index])) p.score++;
      render();
      break;
    }
    case 'practice-next': {
      const p = state.practice;
      if(p.index >= p.questions.length - 1){
        state.view = 'practice-summary';
      } else {
        p.index++;
        p.checked = false;
      }
      render();
      break;
    }
    case 'practice-quit': {
      state.view = 'practice-setup';
      render();
      break;
    }
    case 'practice-retry': {
      state.practice.questions = prepareQuestions(QUESTIONS[state.subject], state.practice.topic, state.practice.count);
      state.practice.index = 0;
      state.practice.answers = [];
      state.practice.checked = false;
      state.practice.score = 0;
      state.view = 'practice-run';
      render();
      break;
    }
    case 'exam-agree-toggle': {
      state.exam.agreed = el.checked;
      render();
      break;
    }
    case 'exam-start': {
      resetExam();
      state.exam.agreed = true;
      state.exam.questions = prepareQuestions(QUESTIONS[state.subject], 'all', examQuestionCount());
      state.exam.index = 0;
      state.exam.timeLeft = examDurationSec();
      state.exam.visited.add(0);
      state.view = 'exam-run';
      render();
      startExamTimer();
      break;
    }
    case 'exam-select': {
      const ex = state.exam;
      const q = ex.questions[ex.index];
      const next = toggleSel(ex.answers[ex.index], parseInt(el.dataset.index, 10), q.multi);
      if(Array.isArray(next) && next.length===0) delete ex.answers[ex.index];
      else ex.answers[ex.index] = next;
      render();
      break;
    }
    case 'exam-clear': {
      delete state.exam.answers[state.exam.index];
      render();
      break;
    }
    case 'exam-save-next':
    case 'exam-mark-next': {
      if(action === 'exam-mark-next') state.exam.marked.add(state.exam.index);
      if(state.exam.index < state.exam.questions.length - 1){
        state.exam.index++;
        state.exam.visited.add(state.exam.index);
      }
      render();
      break;
    }
    case 'exam-jump': {
      state.exam.index = parseInt(el.dataset.index, 10);
      state.exam.visited.add(state.exam.index);
      render();
      break;
    }
    case 'exam-submit-open': {
      state.exam.showModal = true;
      render();
      break;
    }
    case 'exam-submit-cancel': {
      state.exam.showModal = false;
      render();
      break;
    }
    case 'exam-submit-confirm': {
      submitExam(false);
      break;
    }
    case 'exam-retake': {
      resetExam();
      state.view = 'exam-intro';
      render();
      break;
    }
    case 'exam-toggle-review': {
      state.exam.showReview = !state.exam.showReview;
      render();
      break;
    }
  }
}

function resetExam(){
  state.exam = { questions:[], index:0, answers:{}, marked:new Set(), visited:new Set(), timeLeft:EXAM_DURATION_SEC, timerId:null,
    started:false, submitted:false, tabSwitches:0, startedAt:null, agreed:false, showModal:false, showReview:false };
}

/* ================= GLOBAL LISTENERS ================= */
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  handleAction(el.dataset.action, el);
});
document.addEventListener('change', (e)=>{
  if(e.target.id === 'agreeBox'){
    handleAction('exam-agree-toggle', e.target);
  }
});

document.addEventListener('visibilitychange', ()=>{
  if(state.view === 'exam-run' && document.hidden && !state.exam.submitted){
    state.exam.tabSwitches++;
    showToast('Tab switch detected (#' + state.exam.tabSwitches + '). This has been logged for exam integrity.');
    const el = document.querySelector('.flag-indicator');
    if(el) el.innerHTML = ICONS.eye + ' Integrity flags: ' + state.exam.tabSwitches;
  }
});
window.addEventListener('beforeunload', (e)=>{
  if(state.view === 'exam-run' && !state.exam.submitted){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= INIT ================= */
renderTowers();
render();

})();
</script>
