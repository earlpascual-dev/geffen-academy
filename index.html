<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geffen Academy — Study Hall</title>
<style>
  :root{
    --purple-dark:#2e1f47;
    --purple:#4a2f78;
    --purple-mid:#6b46a8;
    --purple-light:#9b74d1;
    --violet-accent:#c9a6ec;
    --green-dark:#24402b;
    --green:#3f6b47;
    --green-light:#6f9a6a;
    --gold:#d8b458;
    --gold-light:#f0d896;
    --gold-dark:#a9822f;
    --stone:#cdbfa0;
    --parchment:#f4ecd8;
    --parchment-dark:#e6d7ae;
    --ink:#2a2216;
    --ink-soft:#5a4d3a;
    --sky-top:#2c2350;
    --sky-bottom:#7fb3c2;
    --danger:#a5432f;
    --danger-light:#f3d9d2;
    --success:#3d7a4f;
    --success-light:#dcecdd;
    --warn:#b8862f;
    --warn-light:#f5e6c6;
    --radius:10px;
    --shadow:0 4px 14px rgba(20,10,35,0.35);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse at 20% 0%, rgba(155,116,209,0.25), transparent 55%),
      radial-gradient(ellipse at 85% 10%, rgba(127,179,194,0.25), transparent 50%),
      linear-gradient(180deg, var(--sky-top) 0%, #4a3f74 22%, #5c7a5e 46%, var(--parchment) 60%);
    min-height:100vh;
  }
  h1,h2,h3,h4{
    font-family:"Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
    letter-spacing:0.03em;
    color:var(--purple-dark);
    margin:0 0 0.5em 0;
  }
  button{font-family:inherit;cursor:pointer;}
  .icon{width:1.1em;height:1.1em;vertical-align:-0.2em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

  /* ---------- Skyline header ---------- */
  #skyline{
    position:relative;
    padding:22px 28px 60px;
    overflow:hidden;
  }
  #skyline::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, transparent 60%, rgba(63,107,71,0.5) 100%);
    pointer-events:none;
  }
  .towers{position:absolute; bottom:0; left:0; right:0; height:70px; display:flex; align-items:flex-end; gap:2px; opacity:0.55; pointer-events:none;}
  .tower{background:var(--purple-dark); width:26px; border-radius:4px 4px 0 0; position:relative;}
  .tower::after{content:"";position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-bottom:16px solid var(--violet-accent);}
  .brand{position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;}
  .brand-title{color:var(--gold-light); text-shadow:0 2px 6px rgba(0,0,0,0.5);}
  .brand-title h1{color:var(--gold-light); font-size:1.9rem; margin-bottom:2px;}
  .brand-title p{margin:0; color:var(--violet-accent); font-size:0.85rem; letter-spacing:0.08em; text-transform:uppercase;}
  nav.tabs{display:flex; gap:8px; flex-wrap:wrap; position:relative; z-index:1;}
  nav.tabs button{
    display:flex; align-items:center; gap:6px;
    background:rgba(244,236,216,0.12);
    border:1px solid rgba(240,216,150,0.4);
    color:var(--gold-light);
    padding:8px 14px;
    border-radius:8px;
    font-size:0.9rem;
    transition:background 0.15s, transform 0.15s;
  }
  nav.tabs button:hover{background:rgba(244,236,216,0.25);}
  nav.tabs button.active{background:var(--gold); color:var(--purple-dark); border-color:var(--gold);}

  /* ---------- Main layout ---------- */
  #app{position:relative; z-index:1; max-width:1180px; margin:-36px auto 60px; padding:0 24px;}
  .panel{
    background:var(--parchment);
    border:1px solid var(--gold-dark);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
  }
  .panel + .panel{margin-top:20px;}
  .ornate{
    position:relative;
    border-image: none;
  }
  .ornate::before{
    content:"";
    position:absolute; inset:5px;
    border:1px solid var(--stone);
    border-radius:6px;
    pointer-events:none;
  }

  /* ---------- Home ---------- */
  .hero{
    background:linear-gradient(135deg, var(--purple) 0%, var(--purple-mid) 60%, var(--green) 130%);
    color:var(--parchment);
    text-align:center;
    padding:36px 24px;
  }
  .hero h2{color:var(--gold-light); font-size:1.6rem;}
  .hero p{color:var(--violet-accent); max-width:640px; margin:8px auto 0; line-height:1.5;}
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; margin-top:20px;}
  .subject-card{
    background:var(--parchment); border:1px solid var(--gold-dark); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
    transition:transform 0.15s;
  }
  .subject-card.clickable:hover{transform:translateY(-3px);}
  .subject-card h3{color:var(--purple); font-size:1.1rem; display:flex; align-items:center; gap:8px;}
  .subject-card p{color:var(--ink-soft); font-size:0.88rem; line-height:1.4; min-height:3em;}
  .subject-card .stats{display:flex; gap:14px; font-size:0.78rem; color:var(--green-dark); margin-top:8px;}
  .subject-card.disabled{opacity:0.55; filter:grayscale(0.4);}
  .ribbon{
    position:absolute; top:10px; right:-28px; transform:rotate(40deg);
    background:var(--gold-dark); color:var(--parchment); font-size:0.65rem; letter-spacing:0.08em;
    padding:3px 34px; box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  .btn{
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
    padding:9px 18px; border-radius:8px; border:1px solid var(--purple);
    background:var(--purple); color:var(--parchment); font-size:0.9rem; font-weight:600;
    transition:background 0.15s, transform 0.1s;
  }
  .btn:hover{background:var(--purple-mid);}
  .btn:active{transform:scale(0.98);}
  .btn.gold{background:var(--gold); border-color:var(--gold-dark); color:var(--purple-dark);}
  .btn.gold:hover{background:var(--gold-light);}
  .btn.outline{background:transparent; color:var(--purple); border-color:var(--purple);}
  .btn.outline:hover{background:rgba(74,47,120,0.08);}
  .btn.danger{background:var(--danger); border-color:#7c2f1f;}
  .btn.danger:hover{background:#bf5236;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn.small{padding:6px 12px; font-size:0.8rem;}

  .progress-section h3{color:var(--purple);}
  table.history{width:100%; border-collapse:collapse; font-size:0.85rem; margin-top:10px;}
  table.history th, table.history td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--parchment-dark);}
  table.history th{color:var(--purple); font-family:"Palatino Linotype",serif;}
  .pill{padding:2px 9px; border-radius:20px; font-size:0.72rem; font-weight:700;}
  .pill.pass{background:var(--success-light); color:var(--success);}
  .pill.fail{background:var(--danger-light); color:var(--danger);}
  .stat-row{display:flex; gap:24px; flex-wrap:wrap; margin:10px 0 18px;}
  .stat-box{background:var(--parchment-dark); border-radius:8px; padding:10px 18px; text-align:center; min-width:100px;}
  .stat-box b{display:block; font-size:1.4rem; color:var(--purple);}
  .stat-box span{font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em;}

  /* ---------- Study view ---------- */
  .study-layout{display:grid; grid-template-columns:220px 1fr; gap:20px;}
  .topic-list{display:flex; flex-direction:column; gap:6px;}
  .topic-list button{
    text-align:left; background:transparent; border:1px solid transparent; border-radius:8px;
    padding:9px 12px; color:var(--ink-soft); font-size:0.88rem;
  }
  .topic-list button:hover{background:var(--parchment-dark);}
  .topic-list button.active{background:var(--purple); color:var(--parchment); font-weight:600;}
  .doc-content h2{border-bottom:2px solid var(--gold); padding-bottom:8px; margin-bottom:14px;}
  .doc-content p, .doc-content li{line-height:1.65; color:var(--ink); font-size:0.96rem;}
  .doc-content ul{padding-left:22px;}
  .archive-note{
    margin-top:18px; background:var(--parchment-dark); border-left:4px solid var(--gold-dark);
    padding:12px 16px; border-radius:6px; font-size:0.88rem; color:var(--ink-soft);
  }
  .archive-note b{color:var(--purple);}
  .doc-content code{font-family:ui-monospace,"Cascadia Code","Consolas",monospace; font-size:0.85em; background:var(--parchment-dark); padding:1px 5px; border-radius:4px; color:var(--purple-dark);}
  .doc-content pre{background:#2a2140; color:#f3eefc; padding:14px 16px; border-radius:8px; overflow-x:auto; margin:12px 0; border:1px solid var(--gold-dark); line-height:1.5;}
  .doc-content pre code{background:none; color:inherit; padding:0; font-size:0.82rem; white-space:pre;}
  .doc-content a{color:var(--purple); font-weight:600; text-decoration:underline; text-underline-offset:2px;}
  .doc-content a:hover{color:var(--gold-dark);}
  .why-note{margin:16px 0; background:linear-gradient(180deg,var(--parchment-dark),#fff); border:1px solid var(--gold); border-left:4px solid var(--purple); padding:14px 18px; border-radius:8px;}
  .why-note b{color:var(--purple-dark);}
  .doc-nav{display:flex; justify-content:space-between; margin-top:22px; padding-top:16px; border-top:1px solid var(--parchment-dark);}

  /* ---------- Practice / Exam shared ---------- */
  .config-row{display:flex; gap:18px; flex-wrap:wrap; margin:16px 0;}
  .config-field label{display:block; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--purple); margin-bottom:5px;}
  select{padding:8px 10px; border-radius:6px; border:1px solid var(--stone); background:#fff; font-size:0.9rem;}
  .rules-list{list-style:none; padding:0; margin:16px 0;}
  .rules-list li{padding:8px 0 8px 28px; position:relative; font-size:0.9rem; color:var(--ink-soft); border-bottom:1px dashed var(--parchment-dark);}
  .rules-list li::before{content:"◆"; position:absolute; left:0; color:var(--gold-dark); font-size:0.8rem;}
  .agree-row{display:flex; align-items:center; gap:8px; margin:18px 0; font-size:0.9rem;}

  .question-progress{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-size:0.85rem; color:var(--ink-soft);}
  .qbar{height:6px; background:var(--parchment-dark); border-radius:4px; overflow:hidden; margin-bottom:18px;}
  .qbar-fill{height:100%; background:var(--gold); transition:width 0.2s;}
  .question-text{font-size:1.08rem; font-weight:600; color:var(--purple-dark); margin-bottom:16px; line-height:1.5;}
  .multi-hint{display:inline-block; margin:-6px 0 14px; padding:3px 10px; border-radius:999px; font-size:0.76rem; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--purple-dark); background:var(--parchment-dark); border:1px solid var(--gold);}
  .option-btn.multi .letter{border-radius:5px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .option-btn{
    text-align:left; display:flex; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--stone); border-radius:8px; padding:11px 14px;
    font-size:0.92rem; color:var(--ink);
  }
  .option-btn:hover{border-color:var(--purple-light); background:#faf6ec;}
  .option-btn .letter{
    width:24px; height:24px; border-radius:50%; border:1px solid var(--stone);
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; flex-shrink:0; color:var(--ink-soft);
  }
  .option-btn.selected{border-color:var(--purple); background:#efe6fb;}
  .option-btn.selected .letter{background:var(--purple); border-color:var(--purple); color:#fff;}
  .option-btn.correct{border-color:var(--success); background:var(--success-light);}
  .option-btn.correct .letter{background:var(--success); border-color:var(--success); color:#fff;}
  .option-btn.wrong{border-color:var(--danger); background:var(--danger-light);}
  .option-btn.wrong .letter{background:var(--danger); border-color:var(--danger); color:#fff;}
  .option-btn:disabled{cursor:default;}
  .explain-box{margin-top:16px; padding:12px 16px; border-radius:8px; font-size:0.88rem; line-height:1.5;}
  .explain-box.correct{background:var(--success-light); color:#204d2b; border-left:4px solid var(--success);}
  .explain-box.wrong{background:var(--danger-light); color:#5c2317; border-left:4px solid var(--danger);}
  .practice-actions{display:flex; justify-content:space-between; margin-top:22px;}
  .score-tag{background:var(--purple); color:var(--parchment); padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:600;}

  .review-item{border:1px solid var(--parchment-dark); border-radius:8px; padding:14px; margin-bottom:12px;}
  .review-item .qh{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .review-item .qh b{color:var(--purple-dark); font-size:0.92rem;}
  .review-item .ans-line{font-size:0.85rem; margin:3px 0;}
  .tag{font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:12px; flex-shrink:0;}
  .tag.correct{background:var(--success-light); color:var(--success);}
  .tag.wrong{background:var(--danger-light); color:var(--danger);}
  .tag.skip{background:var(--warn-light); color:var(--warn);}

  /* ---------- Exam intro ---------- */
  .exam-summary-box{background:var(--parchment-dark); border-radius:8px; padding:14px 18px; margin-top:16px; font-size:0.88rem;}

  /* ---------- Exam run (full immersive) ---------- */
  #examChrome{position:relative; z-index:1; max-width:1180px; margin:16px auto 40px; padding:0 24px;}
  .exam-topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    background:var(--purple-dark); color:var(--parchment); border-radius:var(--radius) var(--radius) 0 0;
    padding:14px 20px; border:1px solid var(--gold-dark); border-bottom:none;
  }
  .exam-topbar .title{font-family:"Palatino Linotype",serif; font-size:1.05rem; color:var(--gold-light);}
  .timer{
    font-variant-numeric:tabular-nums; font-size:1.3rem; font-weight:700; padding:5px 16px;
    border-radius:8px; background:rgba(255,255,255,0.1); border:1px solid rgba(240,216,150,0.4); color:var(--gold-light);
  }
  .timer.low{background:var(--danger); color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
  .flag-indicator{font-size:0.78rem; color:var(--violet-accent); display:flex; align-items:center; gap:5px;}
  .exam-body{
    display:grid; grid-template-columns:1fr 250px; gap:0;
    background:var(--parchment); border:1px solid var(--gold-dark); border-top:none;
  }
  .exam-question-area{padding:24px; border-right:1px solid var(--parchment-dark);}
  .exam-side{padding:18px; background:var(--parchment-dark);}
  .nav-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-bottom:14px;}
  .nav-grid button{
    aspect-ratio:1; border-radius:6px; border:1px solid var(--stone); background:#fff; font-size:0.78rem; color:var(--ink-soft); position:relative;
  }
  .nav-grid button.current{outline:2px solid var(--purple); outline-offset:1px;}
  .nav-grid button.answered{background:var(--success); color:#fff; border-color:var(--success);}
  .nav-grid button.visited{background:var(--warn-light); border-color:var(--warn); color:var(--warn);}
  .nav-grid button.marked::after{
    content:""; position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:var(--purple); border:1px solid #fff;
  }
  .legend{font-size:0.72rem; color:var(--ink-soft); display:flex; flex-direction:column; gap:5px;}
  .legend span{display:flex; align-items:center; gap:6px;}
  .swatch{width:11px; height:11px; border-radius:3px; display:inline-block; border:1px solid var(--stone);}
  .exam-toolbar{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; padding:16px 24px; border-top:1px solid var(--parchment-dark); background:var(--parchment); border:1px solid var(--gold-dark); border-top:none; border-radius:0 0 var(--radius) var(--radius);}
  .exam-toolbar .left-group, .exam-toolbar .right-group{display:flex; gap:8px; flex-wrap:wrap;}

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--warn); color:#3a2b05; padding:10px 20px; border-radius:8px; font-size:0.88rem; font-weight:600;
    box-shadow:var(--shadow); z-index:200; opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  .toast.show{opacity:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(20,10,35,0.55); display:flex; align-items:center; justify-content:center; z-index:300;}
  .modal{background:var(--parchment); border:1px solid var(--gold-dark); border-radius:var(--radius); padding:24px; max-width:420px; width:90%; box-shadow:var(--shadow);}
  .modal h3{margin-bottom:12px;}
  .modal .counts{display:flex; gap:16px; margin:14px 0;}
  .modal .counts div{text-align:center; flex:1; background:var(--parchment-dark); border-radius:8px; padding:8px;}
  .modal .counts b{display:block; font-size:1.2rem; color:var(--purple);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  /* ---------- Result score ring ---------- */
  .score-hero{display:flex; align-items:center; gap:28px; flex-wrap:wrap; justify-content:center; padding:10px 0 24px;}
  .ring{width:150px; height:150px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; flex-shrink:0;}
  .ring b{font-size:2rem; color:var(--purple-dark);}
  .ring span{position:absolute; bottom:34px; font-size:0.72rem; color:var(--ink-soft); text-transform:uppercase;}
  .badge-pass, .badge-fail{padding:6px 16px; border-radius:20px; font-weight:700; font-size:0.95rem; display:inline-block;}
  .badge-pass{background:var(--success-light); color:var(--success);}
  .badge-fail{background:var(--danger-light); color:var(--danger);}

  .topic-bar-row{display:flex; align-items:center; gap:10px; margin:6px 0; font-size:0.85rem;}
  .topic-bar-row .label{width:190px; flex-shrink:0; color:var(--ink-soft);}
  .topic-bar-track{flex:1; height:8px; background:var(--parchment-dark); border-radius:4px; overflow:hidden;}
  .topic-bar-fill{height:100%; background:var(--green);}
  .topic-bar-row .pct{width:40px; text-align:right; color:var(--purple); font-weight:600;}

  footer.small-note{max-width:1180px; margin:0 auto 30px; padding:0 24px; text-align:center; color:rgba(244,236,216,0.6); font-size:0.75rem;}
  @media (max-width:720px){
    .study-layout{grid-template-columns:1fr;}
    .exam-body{grid-template-columns:1fr;}
    .exam-question-area{border-right:none; border-bottom:1px solid var(--parchment-dark);}
  }
</style>
</head>
<body>

<header id="skyline">
  <div class="towers" id="towerRow"></div>
  <div class="brand">
    <div class="brand-title">
      <h1>Geffen Academy</h1>
      <p>Study Hall &amp; Examination Chamber</p>
    </div>
    <nav class="tabs" id="mainNav">
      <button data-action="nav" data-view="home">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Home
      </button>
      <button data-action="nav" data-view="study">
        <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Study
      </button>
      <button data-action="nav" data-view="practice-setup">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Practice
      </button>
      <button data-action="nav" data-view="exam-intro">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>
        Exam
      </button>
    </nav>
  </div>
</header>

<main id="app"></main>
<div id="examChrome"></div>

<footer class="small-note">Geffen Academy is a self-contained local study tool. All progress is stored only in this browser.</footer>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script>
(function(){
"use strict";

/* ================= ICONS ================= */
const ICONS = {
  flag:'<svg class="icon" viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 4h13l-3 4 3 4H5"/></svg>',
  clock:'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  eye:'<svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>',
};

/* ================= CONTENT DATA ================= */
const DOCS = {
  genai: [
    { id:'intro', title:'What Is Generative AI', html:`
      <p>Generative AI refers to a class of artificial intelligence systems trained to <b>produce new content</b> — text, images, audio, code, or video — that resembles patterns found in the data they were trained on, rather than simply sorting, retrieving, or classifying existing information.</p>
      <p>Where a traditional classifier might tell you "this email is spam," a generative model can write a brand-new email, summarize a report, or describe an image from scratch. The defining trait is <i>creation</i>, not just recognition.</p>
      <ul>
        <li>Learns statistical patterns from large datasets during training.</li>
        <li>Samples from what it has learned to generate plausible new outputs.</li>
        <li>Spans multiple modalities: text, images, audio, video, and code.</li>
        <li>Powers tools like chatbots, image generators, and coding assistants.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> The term "generative" simply describes the model's job — generating output — not any particular architecture. Many different architectures (transformers, diffusion models, GANs) can all be "generative."</div>
    `},
    { id:'llm', title:'Large Language Models (LLMs)', html:`
      <p>A Large Language Model (LLM) is a generative model specialized in text. It is trained on enormous amounts of written material to predict, one piece at a time, what text is likely to come next given some input.</p>
      <p>Before an LLM can process text, the text is broken into <b>tokens</b> — words or word-fragments — which the model converts into numbers it can compute with. The amount of tokens a model can "see" at once is called its <b>context window</b>.</p>
      <ul>
        <li><b>Pre-training:</b> the model learns general language patterns from broad text data.</li>
        <li><b>Fine-tuning:</b> further training on a narrower dataset to specialize behavior (e.g., following instructions).</li>
        <li><b>Retrieval-Augmented Generation (RAG):</b> supplying external documents alongside a prompt so the model can reference information beyond its training data.</li>
        <li><b>Hallucination:</b> when a model states something confidently that is not actually true, because it is generating plausible text rather than looking up verified facts.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> The Transformer architecture (2017) — with its "attention" mechanism that lets a model weigh the relevance of different words to each other — is the foundation nearly all modern LLMs are built on.</div>
    `},
    { id:'embeddings', title:'Embeddings & Semantic Search', html:`
      <p>An <b>embedding</b> is a way of turning a piece of content — a word, sentence, image, or document — into a list of numbers (a vector) that captures its meaning. Content with similar meaning ends up with vectors that are close together in this numerical space, even if the exact wording is completely different.</p>
      <p>This is the mechanism behind <b>semantic search</b>: instead of matching exact keywords, a system compares the meaning of a query to the meaning of stored content. It's also the foundation of Retrieval-Augmented Generation (RAG), where relevant documents are found by embedding similarity and then handed to an LLM as context.</p>
      <ul>
        <li>Embeddings are produced by a model trained specifically to map content into a meaningful vector space.</li>
        <li>"Closeness" between vectors is typically measured with cosine similarity or a related distance metric.</li>
        <li>A <b>vector database</b> stores embeddings and can quickly retrieve the closest matches to a query.</li>
        <li>Semantic search can find relevant results even when no exact keywords overlap, unlike traditional keyword search.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> Two sentences with zero words in common — "a dog barking at the mail carrier" and "a canine reacting to the postal worker" — can still produce nearly identical embeddings, because embeddings capture meaning, not surface text.</div>
    `},
    { id:'prompt', title:'Prompt Engineering Basics', html:`
      <p>Prompt engineering is the practice of crafting the input you give a generative model — instructions, context, and examples — to steer it toward the output you actually want.</p>
      <p>Because these models respond to patterns in their input, small wording changes can noticeably change results. A few reliable techniques:</p>
      <ul>
        <li><b>Be specific:</b> state the format, tone, audience, and constraints explicitly rather than leaving them implied.</li>
        <li><b>Few-shot examples:</b> show one or more examples of the input/output pattern you want before asking for the real task.</li>
        <li><b>Chain-of-thought:</b> ask the model to reason step-by-step before giving a final answer, which often improves accuracy on complex tasks.</li>
        <li><b>System prompt:</b> a persistent instruction set (persona, rules, tone) that applies across an entire conversation.</li>
        <li><b>Temperature:</b> a setting that controls randomness — low values give more focused, deterministic output; high values give more varied, creative output.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> Prompt engineering is iterative. Treat your first prompt as a draft — refine it based on what the model actually produces, the same way you'd revise an essay outline.</div>
    `},
    { id:'diffusion', title:'Diffusion Models & Image Generation', html:`
      <p>Most modern text-to-image tools (and increasingly, audio and video tools) are built on <b>diffusion models</b>. Instead of drawing a picture stroke by stroke, a diffusion model starts from a canvas of random noise and gradually <i>denoises</i> it over many steps until a coherent image emerges.</p>
      <p>A text prompt (or other conditioning input) guides each denoising step so the final image matches the description. This is a fundamentally different process from a search engine returning an existing photo — the image is assembled fresh from learned visual patterns.</p>
      <ul>
        <li>Training teaches the model what "less noisy" versions of images look like at every stage.</li>
        <li>Generation reverses that process, starting from pure noise.</li>
        <li>Known weak spots include precise text rendering and exact object counts (e.g., number of fingers).</li>
        <li>The same core idea — iterative refinement guided by a prompt — has been extended to audio and video generation.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> "Diffusion" borrows its name from the physics of particles spreading out (diffusing) into disorder — the model is trained to learn the reverse of that process.</div>
    `},
    { id:'agents', title:'AI Agents & Multimodal Models', html:`
      <p>Beyond generating a single response, many modern systems combine a generative model with the ability to take actions — this is often called an <b>AI agent</b>. An agent can call external tools (search the web, run code, query a database), observe the result, and decide what to do next, sometimes across multiple steps, to accomplish a goal.</p>
      <p>Separately, a <b>multimodal model</b> is one that can accept and/or generate more than one type of content in the same interaction — for example, taking an image and text question together as input, or generating both text and an image in a single response.</p>
      <ul>
        <li><b>Tool use / function calling:</b> the model decides when to invoke an external tool and how to use its output, rather than answering from its own knowledge alone.</li>
        <li><b>Multi-step reasoning:</b> an agent may plan, act, observe results, and adjust its plan repeatedly before finishing.</li>
        <li><b>Multimodal input/output:</b> combining text, images, audio, or video in a single model rather than needing separate specialized tools for each.</li>
        <li>Agents raise new considerations around reliability, since a mistake in one step can affect later steps.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> "Agentic" workflows are often described as giving a model a goal rather than a single instruction — the model figures out the sequence of steps and tool calls needed along the way.</div>
    `},
    { id:'usage', title:'Getting the Most from GenAI Tools', html:`
      <p>Knowing how generative AI works is only half the picture — using it well as a daily tool is its own skill. A few habits separate effective use from frustrating, low-quality results.</p>
      <ul>
        <li><b>Iterate, don't expect perfection on the first try.</b> Treat your first prompt as a draft; refine based on what comes back.</li>
        <li><b>Give the model context it wouldn't otherwise have</b> — relevant background, constraints, examples, or the audience you're writing for.</li>
        <li><b>Match the tool to the task.</b> A coding assistant, an image generator, and a general chat assistant are optimized differently; using the right one saves time.</li>
        <li><b>Verify anything that matters.</b> Before using generated content for something consequential, check facts, citations, or code against a trusted source.</li>
        <li><b>Break big tasks into smaller steps.</b> Asking for an entire project in one prompt tends to produce vaguer results than working through it piece by piece.</li>
        <li><b>Keep a record of prompts that work well</b> for repeated tasks, so you're not reinventing your approach each time.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> Many experienced users treat a generative AI tool like a capable junior collaborator: fast and broadly knowledgeable, but still worth reviewing before its work goes out the door.</div>
    `},
    { id:'ethics', title:'Limitations, Risks & Responsible Use', html:`
      <p>Generative AI is a powerful but imperfect tool. Understanding its failure modes is as important as understanding its capabilities.</p>
      <ul>
        <li><b>Hallucination:</b> confident-sounding but fabricated or false information.</li>
        <li><b>Bias:</b> models can reflect and amplify biases present in their training data, producing skewed or unfair outputs.</li>
        <li><b>Copyright & provenance:</b> open questions remain about training on existing copyrighted works and how generated outputs should be treated legally and ethically.</li>
        <li><b>Over-reliance:</b> leaning on generated output without practicing or verifying skills yourself can erode learning and judgment over time.</li>
      </ul>
      <p>Responsible practices include verifying important claims against reliable sources, keeping a <b>human in the loop</b> for consequential decisions, and using generative tools as an aid to learning and drafting rather than a replacement for understanding.</p>
      <div class="archive-note"><b>Archive Note:</b> A good habit: treat generative AI output the way you'd treat a knowledgeable but occasionally overconfident colleague — useful, fast, but worth double-checking before it goes into anything important.</div>
    `},
    { id:'privacy', title:'Privacy & Security When Using GenAI', html:`
      <p>Because many generative AI tools are cloud-hosted services, what you type into them may be transmitted to, processed by, and in some cases retained by, a third-party provider. Treating that input thoughtfully is part of using these tools responsibly.</p>
      <ul>
        <li><b>Avoid pasting sensitive data</b> — passwords, private keys, personal identifying information, confidential business data — into a general-purpose tool unless you know exactly how that provider handles and retains input.</li>
        <li><b>Check data retention and training policies.</b> Some providers may use submitted content to improve future models unless you opt out; enterprise or paid tiers often have different guarantees than free consumer tools.</li>
        <li><b>Be cautious with generated code or configuration</b> that touches credentials, access control, or production systems — review it as carefully as you would review a colleague's pull request.</li>
        <li><b>Understand who else can see a shared conversation</b> before sharing a chat link or transcript that might contain private details.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> A simple rule of thumb: don't paste anything into a generative AI tool that you wouldn't be comfortable sending in a plain, unencrypted email to a stranger.</div>
    `},
  ],
  claudedev: [
    { id:'cc-why', title:'Why This Certification', html:`
      <p>Before the mechanics, the honest case for <i>why</i> this exam is worth your time — and where it isn't a magic bullet.</p>
      <p><b>What it actually proves.</b> The CCDV-F certifies that you can <i>design, build, and operate production applications on Claude</i> — not that you can chat with an AI. It forces you to learn the whole platform end to end: the Messages API, agents and workflows, tool use and MCP, prompt/context engineering, cost and model trade-offs, and the security practices that keep an LLM app safe. That breadth is the real value: most developers pick up fragments of this on the job; the exam makes you learn the parts you'd otherwise skip.</p>
      <p><b>Why it matters for your career right now.</b> "Can build real software" is table stakes for a senior engineer. "Can build real software <i>with LLMs, safely and cost-effectively</i>" is the skill companies are scrambling to hire for in 2026, and far fewer engineers can prove it. For someone targeting senior full-stack / tech-lead roles, this credential does three concrete things:</p>
      <ul>
        <li><b>Signals competence to hiring managers</b> who can't easily verify AI-engineering skill from a résumé — a vendor-recognized, Pearson VUE-proctored credential is a credible shortcut.</li>
        <li><b>Differentiates you</b> in a stack of full-stack candidates who all list "React, Node, AWS." Few will list a Claude developer cert.</li>
        <li><b>Gives you the vocabulary and mental models</b> to lead AI features — scoping an agent vs a workflow, estimating token cost, defending against prompt injection — which is exactly what a tech lead is asked to do when a team adds AI.</li>
      </ul>
      <p><b>Why it's worth doing even if you never framed the certificate.</b> The study itself upgrades you. After this you'll reach for the right tier (single call → workflow → agent) instead of over-engineering, cache prompts instead of burning tokens, and treat retrieved content as untrusted by reflex. Those habits pay off on every LLM project, certificate or not.</p>
      <div class="why-note"><b>The honest caveat.</b> A certification is a <i>door-opener and a forcing function, not a substitute for building things.</i> It's also a newer credential than, say, AWS certs, so its market recognition is still growing — you're an early mover. Pair it with real projects you can show (you already have several) and it becomes evidence; on its own it's just a line item. Study to <i>learn</i>, and the paper takes care of itself.</div>
      <p><b>So: do you "need" it?</b> Strictly, no — nobody needs any cert. But if you're actively job-hunting for senior/lead roles and want a cost-effective way to both <i>level up</i> on the most in-demand skill of the moment <i>and</i> prove it, this is one of the higher-leverage things you can spend a few focused weeks on. That's the case. Now let's make sure you pass it.</p>
      <div class="archive-note"><b>Archive Note:</b> Treat the certificate as the <i>byproduct</i> of genuinely learning to build on Claude. Everything else in these archives is organized to get you there — read the docs, drill the questions, simulate the exam, and consult the official Anthropic documentation (see the "Official Docs" reading list) as the source of truth.</div>
    `},
    { id:'cc-exam', title:'The Exam & How to Study', html:`
      <p>The <b>Claude Certified Developer — Foundations (CCDV-F)</b> validates that you can design, build, and operate production applications on Claude. It is a knowledge exam, not a coding test — but it assumes you have actually built with the Claude API.</p>
      <ul>
        <li><b>53 questions</b>, multiple-choice and multiple-response. Each item tells you how many answers to select.</li>
        <li><b>120 minutes</b>, delivered via Pearson VUE (online-proctored or test center).</li>
        <li><b>Passing score: 720</b> on a 100–1000 scaled range (roughly 70%+). $125 per attempt.</li>
        <li>Recommended background: 1–5 years engineering, 6+ months with Claude/LLMs, Python and/or TypeScript, comfort with REST APIs and CLIs.</li>
      </ul>
      <p><b>Domains and weight</b> — study in proportion to these. Applications & Integration alone is a third of the exam:</p>
      <ul>
        <li>Applications & Integration — <b>33%</b></li>
        <li>Model Selection & Optimization — <b>17%</b></li>
        <li>Agents & Workflows — <b>15%</b></li>
        <li>Prompt & Context Engineering — <b>11%</b></li>
        <li>Tools & MCP — <b>11%</b></li>
        <li>Security & Safety — <b>8%</b></li>
        <li>Claude Code — <b>3%</b></li>
        <li>Eval, Testing & Debugging — <b>3%</b></li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> The official source of truth is Anthropic's exam guide on the Partner Academy, plus the free Anthropic Academy courses (Building with the Claude API, Claude Platform 101, the two MCP courses, Claude Code 101 / in Action). This platform drills the concepts; pair it with hands-on API work.</div>
    `},
    { id:'cc-plan', title:'4-Week Study Plan', html:`
      <p>A realistic part-time plan (you're studying around a full-time job): about <b>1 hour on weekdays</b> and a <b>longer 2–3 hour block each weekend</b>. It front-loads the heavily-weighted domains and ends with full timed mocks. Each week follows the same loop: <b>read the doc → read the official docs → drill that topic in Practice → build a little</b>.</p>
      <p style="color:var(--ink-soft); font-size:0.9rem;">Spend proportional to exam weight — don't over-invest in Claude Code (3%) or Eval (3%).</p>

      <h3>Week 1 — Foundations + Applications & Integration (33%)</h3>
      <ul>
        <li><b>Read:</b> "Why This Certification", "The Exam & How to Study", then "Applications & Integration". Skim "Worked Examples" §1–3.</li>
        <li><b>Official docs:</b> Streaming, Prompt Caching, Batch Processing, Files, Errors (from the Reading List).</li>
        <li><b>Drill:</b> Practice → topic <i>Applications & Integration</i>, 15–20 questions, until you're at ~80%.</li>
        <li><b>Build:</b> a tiny script that calls the Messages API, streams a response, and adds a cache breakpoint. Confirm <code>cache_read_input_tokens &gt; 0</code> on the second call.</li>
        <li><b>Checkpoint (end of week):</b> short Practice over <i>all</i> topics; note weak spots.</li>
      </ul>

      <h3>Week 2 — Model Selection (17%) + Agents & Workflows (15%)</h3>
      <ul>
        <li><b>Read:</b> "Model Selection & Optimization" and "Agents & Workflows". Worked Examples §2 (tool loop), §6 (batch).</li>
        <li><b>Official docs:</b> Models Overview, Pricing, Adaptive Thinking, Effort, Token Counting; Managed Agents Overview + Quickstart.</li>
        <li><b>Drill:</b> Practice <i>Model Selection</i> then <i>Agents & Workflows</i>, 15 each.</li>
        <li><b>Build:</b> extend last week's script into a small <i>agent loop</i> with one tool (e.g. a calculator or weather stub); loop until <code>end_turn</code>.</li>
        <li><b>Checkpoint:</b> take your <b>first full timed exam</b> (53 Q / 120 min). Don't worry about the score — map the per-domain bars to find gaps.</li>
      </ul>

      <h3>Week 3 — Prompt & Context (11%) + Tools & MCP (11%) + Security (8%)</h3>
      <ul>
        <li><b>Read:</b> "Prompt & Context Engineering", "Tools & MCP", "Security & Safety". Worked Examples §4 (structured outputs).</li>
        <li><b>Official docs:</b> Structured Outputs, Citations; Tool Use Overview, Code Execution, the MCP spec; Errors (retry rules).</li>
        <li><b>Drill:</b> Practice each of the three topics, 12–15 each; re-drill any Week-1/2 topic still under 80%.</li>
        <li><b>Build:</b> add structured outputs (<code>output_config.format</code>) to your tool's result, and consciously treat any external/tool text as untrusted data.</li>
        <li><b>Checkpoint:</b> full timed exam again; compare domain bars to Week 2.</li>
      </ul>

      <h3>Week 4 — Claude Code + Eval, review, and mock exams</h3>
      <ul>
        <li><b>Read:</b> "Claude Code", "Eval, Testing & Debugging", and re-read your two weakest domain docs.</li>
        <li><b>Official docs:</b> Claude Code overview; revisit any doc tied to questions you keep missing.</li>
        <li><b>Drill:</b> Practice your weakest topics to ~85%; do a mixed all-topics set daily.</li>
        <li><b>Mock exams:</b> take full timed exams until you score <b>≥80% twice in a row</b> (that's your buffer above the 70% pass line).</li>
        <li><b>Readiness gate:</b> only book the Pearson VUE exam once you clear that bar <i>and</i> can explain <i>why</i> each answer is right, not just recognize it.</li>
      </ul>

      <div class="why-note"><b>If you only have 2 weeks:</b> compress — Week 1+2 together (foundations, apps, model, agents), then Week 3+4 together (everything else + mocks). Keep the "≥80% twice before booking" gate no matter the timeline.</div>
      <div class="archive-note"><b>Archive Note:</b> The single highest-value activity is <i>building a small real thing</i> with the API — the exam rewards hands-on intuition that pure reading can't give. Treat the "Build" steps as non-optional. And re-confirm the exam blueprint/logistics on Anthropic's Partner Academy before booking.</div>
    `},
    { id:'cc-apps', title:'Applications & Integration (33%)', html:`
      <p>This is the heaviest domain. It covers how the Claude API actually works and how you wire it into real software.</p>
      <p><b>One endpoint.</b> Everything goes through <b>POST /v1/messages</b>. Tool use, structured outputs, vision, and documents are all <i>features of this single endpoint</i> — not separate APIs. You send a <code>model</code>, <code>max_tokens</code>, an optional top-level <code>system</code> prompt, and a <code>messages</code> array of alternating <code>user</code>/<code>assistant</code> turns.</p>
      <ul>
        <li><b>Roles:</b> the <code>system</code> prompt sets persistent instructions/persona and is a separate top-level field, not a message. <code>messages</code> carries the conversation; you resend the full history each turn (the API is stateless).</li>
        <li><b>max_tokens</b> is a hard cap on the response. Hitting it truncates output mid-thought (<code>stop_reason: "max_tokens"</code>) and forces a retry — size it to the task.</li>
        <li><b>stop_reason</b> tells you why generation ended: <code>end_turn</code>, <code>max_tokens</code>, <code>tool_use</code>, <code>pause_turn</code>, or <code>refusal</code>. Always check it before reading content.</li>
        <li><b>Streaming (SSE):</b> use it for long inputs/outputs or high <code>max_tokens</code> to avoid HTTP timeouts, and to show tokens as they arrive. SDK helpers like <code>.get_final_message()</code> assemble the full response.</li>
      </ul>
      <p><b>Supporting endpoints</b> feed into Messages: <b>Batches</b> (async, ~50% cost, results arrive in any order — key by <code>custom_id</code>), <b>Files</b> (upload once, reference by <code>file_id</code>), <b>Token Counting</b> (<code>/v1/messages/count_tokens</code>), and <b>Models</b> (<code>GET /v1/models</code> for live capability/context-window discovery).</p>
      <p><b>Integration practices.</b> Use the <b>official SDK</b> for your language rather than hand-rolling HTTP. Configure <b>timeouts</b> and <b>retries</b> (SDKs retry 408/409/429/5xx + connection errors by default). Keep API calls <b>server-side</b>. Use <b>configuration management</b> — environment variables, not hard-coded keys or models — so you can swap models and settings without code changes.</p>
      <p><b>Mechanics worth memorizing:</b></p>
      <ul>
        <li><b>Prompt caching</b> cuts cost/latency by reusing a stable prefix. Add <code>cache_control: {type: "ephemeral"}</code> at a breakpoint (max 4 per request). Render order is <code>tools → system → messages</code>, so put unchanging content first. Verify it works by checking <code>usage.cache_read_input_tokens &gt; 0</code>; if it's stuck at zero, a <i>silent invalidator</i> (a timestamp, a per-request ID, unsorted JSON) is changing the prefix.</li>
        <li><b>Context editing vs compaction:</b> context editing <i>clears</i> old tool results/thinking blocks; compaction <i>summarizes</i> earlier turns when nearing the window. With compaction you must append the whole <code>response.content</code> (including compaction blocks) back each turn.</li>
        <li><b>Managed Agents flow:</b> create an <b>Agent</b> once (holds model/system/tools), then start <b>Sessions</b> that reference it — each session gets a hosted sandbox.</li>
      </ul>
      <p><b>Common mistakes the exam probes:</b> exposing the API key client-side; lowballing <code>max_tokens</code> (truncation); matching batch results by position instead of <code>custom_id</code>; forgetting the API is stateless (not resending history); and hard-coding model IDs/keys instead of using config.</p>
      <div class="archive-note"><b>Archive Note:</b> Document input: a PDF goes in a <code>document</code> content block (base64 or Files API <code>file_id</code>), placed before the text block. Images go in <code>image</code> blocks. The content-block type must match the file's MIME type.</div>
    `},
    { id:'cc-model', title:'Model Selection & Optimization (17%)', html:`
      <p>Choosing the right model and controlling token spend is a core developer skill.</p>
      <p><b>The three families</b> trade capability against speed and cost:</p>
      <ul>
        <li><b>Opus</b> — most capable reasoning; the default for hard, high-value, or long-horizon agentic work.</li>
        <li><b>Sonnet</b> — balanced speed and capability; the everyday workhorse for coding, agents, and enterprise workloads.</li>
        <li><b>Haiku</b> — fastest and cheapest; great for high-volume, latency-sensitive, or simple tasks, and as a cheap worker/sub-agent model.</li>
      </ul>
      <p>Use exact model ID strings (e.g. <code>claude-opus-5-5</code>, <code>claude-sonnet-5-5</code>, <code>claude-haiku-5-5</code>) — never append date suffixes. Query the <b>Models API</b> for live context window and capabilities rather than hard-coding them.</p>
      <p><b>Tokens and cost.</b> Text is split into <b>tokens</b>; the <b>context window</b> is how many tokens the model can consider at once. You pay per input and per output token, and <b>output tokens cost several times more than input tokens</b>. Count tokens with the <code>count_tokens</code> endpoint — never with third-party tokenizers like tiktoken.</p>
      <ul>
        <li><b>Effort</b> (<code>output_config.effort</code>: low→max) is the first quality-vs-cost lever within a model: higher effort = deeper reasoning and more tokens. Measure before raising a default; coding/agentic work repays high effort, chat/classification often don't.</li>
        <li><b>Adaptive thinking</b> (<code>thinking: {type: "adaptive"}</code>) lets the model decide when and how much to reason. The old fixed <code>budget_tokens</code> concept is deprecated on current models.</li>
        <li><b>Free wins first:</b> prompt caching, trimming input, tightening output, and batching reduce cost without touching quality — reach for effort/model trade-offs after.</li>
      </ul>
      <p><b>Worked decision:</b> a support bot answering millions of short FAQs → Haiku at low effort (volume + latency). A nightly agent that refactors a codebase → Opus at high/xhigh effort (hard reasoning, correctness matters). A mixed pipeline → route easy items to Haiku, escalate hard ones to a stronger model (but measure first — one model at lower effort often beats a cascade, and caches are model-scoped, so a cascade forfeits cache reuse).</p>
      <p><b>Lever order for cost (do the free wins first):</b></p>
      <ol>
        <li><b>Prompt caching</b> — reuse stable prefixes.</li>
        <li><b>Input hygiene</b> — don't send what the model doesn't need.</li>
        <li><b>Output hygiene</b> — ask for concise output (output tokens cost more).</li>
        <li><b>Batch</b> — ~50% off for non-urgent work.</li>
        <li><i>Then</i> trade-offs: lower <b>effort</b>, then a smaller <b>model</b>.</li>
      </ol>
      <p><b>Common mistakes the exam probes:</b> using tiktoken instead of <code>count_tokens</code>; appending date suffixes to model IDs; reaching for a multi-model cascade before measuring a single strong model at lower effort; and comparing cost per request instead of per completed task.</p>
      <div class="archive-note"><b>Archive Note:</b> Judge cost <i>per completed task</i>, not per request. A cheaper model that needs more turns or retries to finish the job is not actually cheaper. Measure on real traffic before cascading across multiple models.</div>
    `},
    { id:'cc-agents', title:'Agents & Workflows (15%)', html:`
      <p>Know the difference between a workflow and an agent, and when each is appropriate.</p>
      <ul>
        <li><b>Workflow</b> — <i>you</i> orchestrate the control flow in code. The path is predetermined: prompt chaining, routing, parallelization. Predictable, testable, cheaper.</li>
        <li><b>Agent</b> — the <i>model</i> drives the loop, deciding which tools to call and when, over multiple steps, until it reaches a goal. Flexible but less predictable and more expensive.</li>
      </ul>
      <p><b>Start simple.</b> Use the least complex tier that solves the problem: a single call, then a workflow, and only reach for an agent when the task is genuinely open-ended. Before building an agent, check: is it <b>complex</b> (hard to fully specify)? Does the <b>value</b> justify the cost/latency? Is Claude <b>viable</b> at it? Can you recover from <b>errors</b> (tests, review, rollback)? A "no" means stay simpler.</p>
      <p><b>Common patterns:</b></p>
      <ul>
        <li><b>Prompt chaining</b> — break a task into sequential steps, each feeding the next.</li>
        <li><b>Routing</b> — classify the input, then send it to a specialized prompt/model.</li>
        <li><b>Parallelization</b> — run independent subtasks concurrently and aggregate.</li>
        <li><b>Orchestrator–workers</b> — a lead model decomposes work and delegates to workers.</li>
        <li><b>Evaluator–optimizer</b> — one model generates, another critiques and iterates.</li>
      </ul>
      <p>The <b>agent loop</b> is: call the API → if <code>stop_reason</code> is <code>tool_use</code>, execute the tool(s) and append <code>tool_result</code>(s) → call again → repeat until <code>end_turn</code>. SDK <b>tool runners</b> automate this loop for tools you define; you can also write the loop by hand for full control.</p>
      <p><b>Four ways to build an agent</b> (two questions: who supplies the <i>harness</i>, who supplies the <i>deployment</i>):</p>
      <ul>
        <li><b>Manual loop</b> — you write the <code>while stop_reason == "tool_use"</code> loop and host it. Full control, only your tools.</li>
        <li><b>SDK tool runner</b> — the SDK drives the loop over tools you define (with per-turn hooks for approval/retry); you still host. Most custom-tool agents.</li>
        <li><b>Managed Agents</b> — Anthropic runs the loop <i>and</i> hosts a per-session sandbox (bash, files, code exec) + Skills/MCP. Persisted, versioned, long-running, schedulable.</li>
        <li><b>Claude Agent SDK</b> — Claude Code as a library: built-in file/shell/search tools + full harness, hosted by you. (This exam domain focuses on the first three.)</li>
      </ul>
      <p><b>Common mistakes the exam probes:</b> jumping to an agent when a workflow suffices; confusing the tool runner (harness only, your tools) with the Agent SDK (full coding harness) or Managed Agents (harness + hosted sandbox); splitting parallel tool results across messages; and letting tool output flood the context (use context editing/compaction).</p>
      <div class="archive-note"><b>Archive Note:</b> "Managed Agents" is a separate hosted surface where Anthropic runs the loop and hosts a per-session sandbox. The Claude Agent SDK is Claude Code packaged as a library. Both differ from the plain API tool-use loop — don't conflate them.</div>
    `},
    { id:'cc-prompt', title:'Prompt & Context Engineering (11%)', html:`
      <p>Prompt engineering shapes a single request; context engineering manages what the model sees across a long interaction.</p>
      <p><b>Prompt techniques:</b></p>
      <ul>
        <li><b>Be explicit</b> about format, tone, audience, and constraints — don't leave them implied.</li>
        <li><b>Use the system prompt</b> for role, rules, and persistent behavior; put the task in the user turn.</li>
        <li><b>Few-shot examples</b> show the input→output pattern you want before the real task.</li>
        <li><b>Structure with XML tags or headings</b> to separate instructions, context, and data — Claude follows clearly delimited structure well.</li>
        <li><b>Let the model reason</b> (adaptive thinking / "think step by step") on complex tasks before the final answer.</li>
      </ul>
      <p><b>Context engineering</b> is deciding what to include, in what order, and what to drop as a conversation grows:</p>
      <ul>
        <li><b>Prompt caching</b> rewards putting stable content (system prompt, tool list, reference docs) <i>first</i> and volatile content last.</li>
        <li><b>Retrieval (RAG)</b> injects only the relevant documents instead of stuffing everything into context.</li>
        <li><b>Context editing</b> clears old tool results/thinking; <b>compaction</b> summarizes earlier turns when nearing the window limit.</li>
      </ul>
      <p><b>Output handling:</b> for reliable machine-readable output use <b>structured outputs</b> (<code>output_config.format</code> with a JSON schema) or <code>strict: true</code> on a tool — far more reliable than asking for JSON in prose and parsing by hand. Note: assistant-message <b>prefill is removed on current models</b>; use structured outputs or system instructions to control format instead.</p>
      <p><b>A reliable prompt skeleton:</b> (1) role/rules in the <code>system</code> prompt; (2) context/reference material in clearly tagged sections; (3) the task and any few-shot examples; (4) the exact output format. Keep the stable parts first so caching holds.</p>
      <p><b>Common mistakes the exam probes:</b> relying on assistant <b>prefill</b> (removed on current models — use structured outputs); parsing JSON out of prose instead of using <code>output_config.format</code>/<code>strict</code>; putting volatile content before the cache breakpoint; and carrying over an over-prescriptive prompt written for an older model.</p>
      <div class="archive-note"><b>Archive Note:</b> To reduce <b>hallucination</b>: ground the model with retrieved documents and citations, give it tools to look things up, and explicitly permit "I don't know" rather than forcing an answer.</div>
    `},
    { id:'cc-tools', title:'Tools & MCP (11%)', html:`
      <p><b>Tool use (function calling)</b> lets Claude call functions you define.</p>
      <ul>
        <li>You declare each tool with a <code>name</code>, <code>description</code>, and an <code>input_schema</code> (JSON Schema). A clear description is what makes Claude use the tool correctly.</li>
        <li>Claude returns a <code>tool_use</code> block (with <code>stop_reason: "tool_use"</code>). <i>You</i> execute the function and return the result as a <code>tool_result</code> block in a <b>user</b> message.</li>
        <li><b>Parallel tool use</b> is on by default: one assistant message may contain several <code>tool_use</code> blocks. Return <b>all</b> <code>tool_result</code> blocks in a <b>single</b> user message — splitting them trains Claude to stop calling in parallel.</li>
        <li>For a failed call, return a <code>tool_result</code> with <code>is_error: true</code> — don't drop it.</li>
        <li><b>strict: true</b> on a tool guarantees the <code>input</code> validates exactly against the schema (needs <code>additionalProperties: false</code> + <code>required</code>). Always parse tool input with a real JSON parser, never string matching.</li>
      </ul>
      <p><b>Server-side tools</b> run on Anthropic's infrastructure (web search, web fetch, code execution) — you declare them and results come back in the same response, no client loop.</p>
      <p><b>Model Context Protocol (MCP)</b> is an open standard for connecting LLMs to external tools and data through <b>MCP servers</b>. It decouples integrations: build a server once, and any MCP-aware client (Claude Code, the API's MCP connector, desktop apps) can use it.</p>
      <ul>
        <li>MCP primitives: <b>tools</b> (actions the model can invoke), <b>resources</b> (data/content the model can read), and <b>prompts</b> (reusable templates).</li>
        <li>Via the API's MCP connector you must supply <i>both</i> halves: the <code>mcp_servers</code> list <i>and</i> an <code>mcp_toolset</code> tool entry referencing the same server name.</li>
      </ul>
      <p><b>The tool-use round trip, step by step:</b> (1) you send <code>tools</code> + messages; (2) Claude replies with a <code>tool_use</code> block and <code>stop_reason: "tool_use"</code>; (3) you run the function; (4) you append a <code>tool_result</code> block (matching <code>tool_use_id</code>) in a <b>user</b> message; (5) you call again; (6) repeat until <code>end_turn</code>.</p>
      <p><b>Common mistakes the exam probes:</b> forgetting that <i>you</i> execute client tools (not Anthropic); returning parallel results across multiple messages instead of one; dropping failed calls instead of returning <code>is_error: true</code>; string-matching tool input instead of parsing JSON; declaring <code>mcp_servers</code> without the matching <code>mcp_toolset</code>; and giving a custom tool your own schema under the name "bash".</p>
      <div class="archive-note"><b>Archive Note:</b> The bash and text-editor tools are Anthropic-defined and schema-less — you declare them by <code>type</code> with no <code>input_schema</code>. A custom tool you name "bash" with your own schema is a different tool.</div>
    `},
    { id:'cc-security', title:'Security & Safety (8%)', html:`
      <p>Treat an LLM application like any other system that handles untrusted input and secrets.</p>
      <p><b>Keys & secrets:</b></p>
      <ul>
        <li><b>Never put your API key in client-side code</b> (browser, mobile app). Calls go through a server/proxy you control; the key lives in a secret store or environment variable, never in source or version control.</li>
        <li>Rotate keys, scope them narrowly, and use separate keys per environment.</li>
      </ul>
      <p><b>Prompt injection</b> is the signature LLM threat: malicious instructions hidden in user input, retrieved documents, tool output, or web pages try to override your system prompt. Defenses:</p>
      <ul>
        <li>Keep trusted instructions in the <b>system</b> prompt; treat all external/retrieved content as <b>data, not instructions</b>.</li>
        <li><b>Gate high-impact tool calls</b> behind validation, allow-lists, and human approval — especially anything that sends data out, spends money, or deletes.</li>
        <li>Apply <b>least privilege</b> to tools and MCP servers.</li>
      </ul>
      <p><b>Guardrails & safe deployment:</b> validate and sanitize inputs and outputs, filter or classify unsafe content, keep a <b>human in the loop</b> for consequential actions, and log/monitor for abuse. Check <code>stop_reason: "refusal"</code> and handle it gracefully.</p>
      <p><b>Claude hooks</b> (in Claude Code) run your own commands on events such as before/after a tool call — useful for enforcing policy, blocking dangerous actions, or logging.</p>
      <div class="archive-note"><b>Archive Note:</b> Don't send data to an external service without authorization — once sent it may be cached or indexed even if later deleted. For deletes/overwrites and outward-facing actions, confirm first unless explicitly and durably authorized.</div>
    `},
    { id:'cc-code', title:'Claude Code (3%)', html:`
      <p><b>Claude Code</b> is Anthropic's agentic coding tool that runs in the terminal (and IDEs), reading and editing files, running commands, and using tools to complete development tasks.</p>
      <ul>
        <li><b>CLAUDE.md</b> is project memory: conventions, commands, and context Claude loads automatically each session.</li>
        <li><b>Slash commands</b> (e.g. <code>/init</code>, <code>/review</code>) and user-defined commands trigger repeatable workflows.</li>
        <li><b>MCP servers</b> extend Claude Code with external tools and data sources.</li>
        <li><b>Hooks</b> run commands on lifecycle events (e.g. before a tool call, on stop) to enforce rules or automate steps.</li>
        <li><b>Permissions</b> control which actions run automatically vs. need approval — the safety boundary for an agent editing your code.</li>
        <li><b>Subagents</b> delegate focused subtasks; <b>skills</b> package reusable instructions.</li>
      </ul>
      <div class="archive-note"><b>Archive Note:</b> Claude Code is built on the same tool-use loop you learn in the Agents domain — it's a concrete example of an agent with built-in file, shell, and search tools running on your own machine.</div>
    `},
    { id:'cc-eval', title:'Eval, Testing & Debugging (3%)', html:`
      <p>You can't improve what you don't measure, and LLM outputs are non-deterministic — so testing looks different from ordinary unit tests.</p>
      <ul>
        <li><b>Build an eval set:</b> representative inputs with a grading method (exact match, rubric, or an LLM-as-judge). Run it before and after a change to know whether you actually improved — don't trust "vibes."</li>
        <li><b>Iterate against the eval</b> ("hill-climbing"): change one thing, re-run, keep or revert based on the score. Use a held-out test split so you don't overfit.</li>
        <li><b>Debug by reading <code>stop_reason</code> and <code>usage</code>:</b> truncation (<code>max_tokens</code>), refusals, and low cache hits (<code>cache_read_input_tokens</code> stuck at zero) each point to different fixes.</li>
      </ul>
      <p><b>Error handling:</b> catch <b>specific</b> SDK exception types, not one broad class. Retry transient failures — <b>429 (rate limit)</b> and <b>5xx</b> — with backoff; do <b>not</b> retry <b>4xx</b> like 400/404 (they won't succeed on retry). Return tool failures as <code>tool_result</code> with <code>is_error: true</code> so the model can recover.</p>
      <div class="archive-note"><b>Archive Note:</b> Observability (e.g. OpenTelemetry tracing, logging <code>response.usage</code>) turns production behavior into data you can debug and cost-optimize against — but it needs a backend you run, so add it once you have real traffic.</div>
    `},
    { id:'cc-examples', title:'Worked Examples — API Patterns', html:`
      <p>Concrete patterns for the mechanics the exam tests. These are illustrative (Python SDK); the exact field names and newest options always live in the official docs linked at the bottom of each block — treat those as the source of truth.</p>

      <h3>1 · A basic request</h3>
      <p>Everything is <code>POST /v1/messages</code>. The <code>system</code> prompt is a top-level field; <code>messages</code> is the conversation; <code>max_tokens</code> caps the output.</p>
      <pre><code>from anthropic import Anthropic
client = Anthropic()  # reads ANTHROPIC_API_KEY

resp = client.messages.create(
    model="claude-sonnet-5-5",
    max_tokens=1024,
    system="You are a concise technical assistant.",
    messages=[{"role": "user", "content": "Explain tokens in one sentence."}],
)
print(resp.content[0].text)
print(resp.stop_reason)   # "end_turn" | "max_tokens" | "tool_use" | "refusal" | ...
print(resp.usage)         # input/output tokens, cache reads</code></pre>

      <h3>2 · The tool-use loop</h3>
      <p>Define a tool with an <code>input_schema</code>. Claude replies with a <code>tool_use</code> block; <i>you</i> run the function and return a <code>tool_result</code> in a <b>user</b> message; repeat until <code>end_turn</code>.</p>
      <pre><code>tools = [{
  "name": "get_weather",
  "description": "Get current weather for a city.",
  "input_schema": {
    "type": "object",
    "properties": {"city": {"type": "string"}},
    "required": ["city"], "additionalProperties": False
  },
  "strict": True    # guarantees input validates exactly against the schema
}]

msgs = [{"role": "user", "content": "What's the weather in Manila?"}]
resp = client.messages.create(model="claude-sonnet-5-5", max_tokens=1024,
                              tools=tools, messages=msgs)

while resp.stop_reason == "tool_use":
    msgs.append({"role": "assistant", "content": resp.content})
    results = []
    for block in resp.content:
        if block.type == "tool_use":
            try:
                out = run_tool(block.name, block.input)   # your code
                results.append({"type": "tool_result", "tool_use_id": block.id,
                                "content": out})
            except Exception as e:
                results.append({"type": "tool_result", "tool_use_id": block.id,
                                "content": str(e), "is_error": True})
    msgs.append({"role": "user", "content": results})   # ALL results in ONE message
    resp = client.messages.create(model="claude-sonnet-5-5", max_tokens=1024,
                                  tools=tools, messages=msgs)</code></pre>
      <p><b>Why this shape:</b> returning all parallel <code>tool_result</code> blocks in a single user message keeps parallel tool use working; <code>is_error: True</code> lets the model recover instead of crashing.</p>

      <h3>3 · Prompt caching</h3>
      <p>Mark the end of stable content with <code>cache_control</code>. Stable-first, volatile-last. Verify with <code>usage.cache_read_input_tokens</code>.</p>
      <pre><code>resp = client.messages.create(
    model="claude-sonnet-5-5", max_tokens=512,
    system=[{
        "type": "text",
        "text": LONG_STABLE_INSTRUCTIONS_AND_REFERENCE_DOCS,
        "cache_control": {"type": "ephemeral"}    # cache everything up to here
    }],
    messages=[{"role": "user", "content": todays_question}],  # volatile → after the breakpoint
)
assert resp.usage.cache_read_input_tokens > 0   # 0 = a silent invalidator broke the prefix</code></pre>

      <h3>4 · Structured outputs (reliable JSON)</h3>
      <p>Constrain the response to a schema with <code>output_config.format</code> instead of parsing JSON out of prose. (Assistant prefill is removed on current models — use this.)</p>
      <pre><code>resp = client.messages.create(
    model="claude-sonnet-5-5", max_tokens=1024,
    output_config={"format": {
        "type": "json_schema",
        "schema": {"type": "object",
                   "properties": {"sentiment": {"type": "string"},
                                  "score": {"type": "number"}},
                   "required": ["sentiment", "score"]}
    }},
    messages=[{"role": "user", "content": "Classify: 'I love this!'"}],
)</code></pre>

      <h3>5 · Streaming (long outputs)</h3>
      <pre><code>with client.messages.stream(
    model="claude-sonnet-5-5", max_tokens=8000,
    messages=[{"role": "user", "content": "Write a detailed design doc."}],
) as stream:
    for text in stream.text_stream:
        print(text, end="")
    final = stream.get_final_message()   # full assembled response</code></pre>
      <p>Use streaming for large <code>max_tokens</code> so a long generation doesn't hit the HTTP timeout.</p>

      <h3>6 · Batch (async, ~50% cost)</h3>
      <pre><code>batch = client.messages.batches.create(requests=[
    {"custom_id": "req-1", "params": {...}},
    {"custom_id": "req-2", "params": {...}},
])
# poll batches.retrieve(batch.id).processing_status until "ended",
# then stream results and key them by custom_id (order is NOT guaranteed).</code></pre>

      <h3>7 · Robust error handling</h3>
      <pre><code>import anthropic
try:
    resp = client.messages.create(...)
except anthropic.NotFoundError:      # 404 — do NOT retry
    ...
except anthropic.RateLimitError:     # 429 — retry with backoff
    ...
except anthropic.APIStatusError as e:
    if e.status_code >= 500: ...      # retry
    else: ...                        # 4xx — fix the request</code></pre>
      <div class="archive-note"><b>Archive Note:</b> The SDK retries 408/409/429/5xx + connection errors by default. Catch specific exception types (most-specific first), not one broad class, so you don't retry a deterministic 400/404.</div>
    `},

    { id:'m19', topic:'model', text:'What does the effort setting control?', options:[

    { id:'m20', topic:'model', text:'For a simple classification route, what effort level is usually appropriate?', options:[

    { id:'m21', topic:'model', text:'Which is the right unit to compare two model/effort configurations on cost?', options:[

/* ================= HELPERS ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function prepareQuestions(bank, topicFilter, count){
  let pool = bank.slice();
  if(topicFilter && topicFilter!=='all') pool = pool.filter(q=>q.topic===topicFilter);
  pool = shuffle(pool);
  if(count && count < pool.length) pool = pool.slice(0, count);
  return pool.map(q=>{
    const optIndices = shuffle(q.options.map((_,i)=>i));
    const options = optIndices.map(i=>q.options[i]);
    const rawCorrect = Array.isArray(q.correct) ? q.correct : [q.correct];
    const correct = rawCorrect.map(c=>optIndices.indexOf(c)).sort((a,b)=>a-b); // always an array of new indices
    const multi = correct.length > 1;
    return { id:q.id, topic:q.topic, text:q.text, options, correct, multi, explanation:q.explanation };
  });
}
/* Answer helpers — a selection is a number (single) or an array of indices (multi). */
function selArr(ans){
  if(ans==null) return [];
  if(Array.isArray(ans)) return ans.slice();
  return [ans];
}
function isAnswered(ans){ return selArr(ans).length > 0; }
function isCorrectAnswer(q, ans){
  const sel = selArr(ans);
  if(sel.length !== q.correct.length) return false;
  return q.correct.every(c=>sel.includes(c));
}
function answerText(q, ans){
  const sel = selArr(ans).slice().sort((a,b)=>a-b);
  if(!sel.length) return '—';
  return sel.map(i=>q.options[i]).join('; ');
}
function correctText(q){
  return q.correct.slice().sort((a,b)=>a-b).map(i=>q.options[i]).join('; ');
}
function toggleSel(current, idx, multi){
  if(!multi) return idx;               // single-select: replace
  const arr = selArr(current);
  const pos = arr.indexOf(idx);
  if(pos>=0) arr.splice(pos,1); else arr.push(idx);
  return arr;
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function letterFor(i){ return String.fromCharCode(65+i); }
function esc(str){
  const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
}
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(historyKey())) || []; }catch(e){ return []; }
}
function saveHistory(list){ try{ localStorage.setItem(historyKey(), JSON.stringify(list)); }catch(e){ /* storage blocked (private mode) — scores just won't persist */ } }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 3200);
}

/* ================= RENDER: PRACTICE RUN ================= */
function renderPracticeRun(){
  const p = state.practice;
  const q = p.questions[p.index];
  const total = p.questions.length;
  const selected = p.answers[p.index];
  const checked = p.checked;
  const pct = Math.round((p.index)/total*100);
  const isLast = p.index === total-1;

  const sel = selArr(selected);

  const optionsHtml = q.options.map((opt,i)=>{
    let cls = 'option-btn';
    if(q.multi) cls += ' multi';
    if(!checked && sel.includes(i)) cls += ' selected';
    if(checked){
      if(q.correct.includes(i)) cls += ' correct';
      else if(sel.includes(i)) cls += ' wrong';
    }
    return `<button class="${cls}" ${checked?'disabled':''} data-action="practice-select" data-index="${i}">
      <span class="letter">${letterFor(i)}</span><span>${esc(opt)}</span>
    </button>`;
  }).join('');

  let explainHtml = '';
  if(checked){
    const wasCorrect = isCorrectAnswer(q, selected);
    explainHtml = `<div class="explain-box ${wasCorrect?'correct':'wrong'}">
      <b>${wasCorrect ? 'Correct.' : 'Not quite.'}</b> ${esc(q.explanation)}
      ${!wasCorrect ? `<div class="ans-line" style="margin-top:6px;">Correct answer: <b>${esc(correctText(q))}</b></div>` : ''}
    </div>`;
  }

  return `
    <div class="panel ornate">
      <div class="question-progress">
        <span>Question ${p.index+1} of ${total} &middot; ${esc(topicLabel(q.topic))}</span>
        <span class="score-tag">Score: ${p.score}/${p.index + (checked?1:0)}</span>
      </div>
      <div class="qbar"><div class="qbar-fill" style="width:${pct}%"></div></div>
      <div class="question-text">${esc(q.text)}</div>
      ${q.multi ? `<div class="multi-hint">Select all that apply (${q.correct.length} correct)</div>` : ''}
      <div class="options">${optionsHtml}</div>
      ${explainHtml}
      <div class="practice-actions">
        <button class="btn outline" data-action="practice-quit">Quit to Setup</button>
        ${!checked
          ? `<button class="btn gold" data-action="practice-check" ${sel.length===0?'disabled':''}>Check Answer</button>`
          : `<button class="btn gold" data-action="practice-next">${isLast?'Finish Practice':'Next Question'}</button>`
        }
      </div>
    </div>
  `;
}
